[build-system]
requires = ["setuptools>=68.2.2", "wheel>=0.41.2"]
build-backend = "setuptools.build_meta"

[project]
name = "loominar"
version = "1.0.0"
description = "Export SonarQube issues and quality metrics into Word, Excel, or CSV reports - with no 10,000-issue ceiling."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name = "Mohamed Ali", email = "mhmd.alibinbashir@gmail.com" }
]
maintainers = [
    { name = "Mohamed Ali", email = "mhmd.alibinbashir@gmail.com" }
]

keywords = [
    "sonarqube",
    "sonarqube-api",
    "report",
    "reporting",
    "code-quality",
    "static-analysis",
    "excel",
    "word",
    "csv",
    "automation",
    "devops",
    "devsecops",
    "ci-cd",
    "loominar",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "requests>=2.31.0",
    "matplotlib>=3.8.0",
    "xlsxwriter>=3.1.2",
    "python-docx>=1.1.0",
    # console.py imports colorama at startup, so it is a runtime requirement,
    # not a dev extra - a clean install used to fail with ModuleNotFoundError.
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "black>=23.9.1",
    "build>=1.0.3",
    "twine>=4.0.2",
]

[project.urls]
Homepage = "https://github.com/mhmd4li/Loominar"
Documentation = "https://github.com/mhmd4li/Loominar#readme"
Repository = "https://github.com/mhmd4li/Loominar"
Issues = "https://github.com/mhmd4li/Loominar/issues"
Changelog = "https://github.com/mhmd4li/Loominar/blob/main/CHANGELOG.md"

[project.scripts]
# setuptools wraps this as sys.exit(main()); main() returns the exit code.
loominar = "loominar.main:main"

[tool.setuptools]
# Explicit rather than auto-discovered: loominar.api.issues was silently left
# out of the 0.2.x wheels, which made a fresh `pip install loominar` fail at
# import time. Any new subpackage must be added here.
packages = [
    "loominar",
    "loominar.api",
    "loominar.api.issues",
    "loominar.report",
]

[tool.black]
line-length = 110
target-version = ["py39"]
